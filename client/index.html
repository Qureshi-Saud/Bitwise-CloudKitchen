<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />

    <!--
      This shell ships no brand of its own. The title, description, keywords,
      og:* tags, favicon and apple-touch-icon below are empty placeholders that
      SettingsContext fills in at runtime from the SEO and branding values saved
      in Admin Panel -> Organization. The "data:," icon href stops the browser
      requesting a /favicon.ico that does not exist before that happens.
    -->
    <link rel="icon" href="data:," />
    <link rel="apple-touch-icon" href="data:," />

    <title>Loading store...</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://images.unsplash.com" />

  </head>
  <body class="bg-cream text-charcoal antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
